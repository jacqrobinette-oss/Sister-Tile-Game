<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sister Tile Game #001</title>
<style>
:root {
  --bg:#f7f4ed; --card:#fffdf8; --ink:#232323; --muted:#6e6a63;
  --line:#ddd7cc; --accent:#6e5aa6; --good:#2f7d52; --bad:#a94b4b;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap { max-width:560px; margin:0 auto; padding:22px 16px 36px; }
h1 { text-align:center; margin:0; font-size:30px; }
.sub { text-align:center; color:var(--muted); margin:6px 0 16px; }
.stats { display:flex; justify-content:center; gap:10px; margin-bottom:14px; }
.pill { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-weight:700; }
.current {
  min-height:64px; background:var(--card); border:2px solid var(--line); border-radius:16px;
  padding:12px; margin-bottom:14px; display:flex; align-items:center; justify-content:center;
  text-align:center; font-size:20px; font-weight:800;
}
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.tile {
  border:1.5px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink);
  min-height:58px; font-size:20px; font-weight:800;
}
.tile.selected { outline:3px solid #b8add7; }
.tile.used { opacity:.3; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.action { border:0; border-radius:14px; min-height:48px; font-size:16px; font-weight:800; }
.primary { background:var(--accent); color:#fff; }
.secondary { background:#e8e3f4; color:#493a74; }
.message { min-height:30px; text-align:center; padding-top:10px; font-weight:700; }
.found { margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip { background:#e4f2e9; color:#245f40; border-radius:999px; padding:6px 10px; font-weight:800; }
.footer { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
.small { border:1px solid var(--line); background:transparent; border-radius:999px; padding:8px 11px; font-weight:700; }
#noscript { margin:14px 0; padding:10px; background:#fff1cc; border-radius:12px; color:#6e5400; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sister Tile Game</h1>
  <div class="sub">Puzzle #001 · Find five 4-tile words</div>

  <div class="stats">
    <div class="pill">Found: <span id="foundCount">0</span>/5</div>
    <div class="pill">Score: <span id="score">0</span>/25</div>
  </div>

  <div class="current" id="current">Tap four tiles to build a word</div>

  <div class="grid" id="grid">
    <button class="tile" data-index="0" data-tile="wa">wa</button>
<button class="tile" data-index="1" data-tile="der">der</button>
<button class="tile" data-index="2" data-tile="fri">fri</button>
<button class="tile" data-index="3" data-tile="gra">gra</button>
<button class="tile" data-index="4" data-tile="on">on</button>
<button class="tile" data-index="5" data-tile="ven">ven</button>
<button class="tile" data-index="6" data-tile="ph">ph</button>
<button class="tile" data-index="7" data-tile="ful">ful</button>
<button class="tile" data-index="8" data-tile="to">to</button>
<button class="tile" data-index="9" data-tile="re">re</button>
<button class="tile" data-index="10" data-tile="mel">mel</button>
<button class="tile" data-index="11" data-tile="sh">sh</button>
<button class="tile" data-index="12" data-tile="ad">ad</button>
<button class="tile" data-index="13" data-tile="ip">ip</button>
<button class="tile" data-index="14" data-tile="ly">ly</button>
<button class="tile" data-index="15" data-tile="ter">ter</button>
<button class="tile" data-index="16" data-tile="pho">pho</button>
<button class="tile" data-index="17" data-tile="end">end</button>
<button class="tile" data-index="18" data-tile="tu">tu</button>
<button class="tile" data-index="19" data-tile="won">won</button>
  </div>

  <noscript><div id="noscript">The tiles are visible, but interaction needs Safari or another browser with JavaScript enabled.</div></noscript>

  <div class="actions">
    <button class="action secondary" id="undoBtn">Undo</button>
    <button class="action primary" id="submitBtn">Submit</button>
  </div>

  <div class="message" id="message"></div>

  <div class="found">
    <strong>Quartiles found</strong>
    <div class="chips" id="foundList" style="margin-top:9px"><span style="color:#aaa49b">None yet</span></div>
  </div>

  <div class="footer">
    <button class="small" id="hintBtn">Hint</button>
    <button class="small" id="resetBtn">Reset</button>
    <button class="small" id="shareBtn">Share Results</button>
    <button class="small" id="solutionBtn">Show solution</button>
  </div>
</div>

<script>
(function() {
  const solutions = {
    wonderfully: ["won","der","ful","ly"],
    friendship: ["fri","end","sh","ip"],
    watermelon: ["wa","ter","mel","on"],
    adventure: ["ad","ven","tu","re"],
    photograph: ["pho","to","gra","ph"]
  };
  const hints = {
    wonderfully: "In a delightful or excellent way.",
    friendship: "A close relationship built on affection and trust.",
    watermelon: "A large summer fruit with a green rind.",
    adventure: "An exciting or unusual experience.",
    photograph: "An image captured with a camera."
  };

  let selected = [];
  let found = [];
  let hintIndex = 0;
  const storageKey = 'sisterTileGame001';

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    if (Array.isArray(saved.found)) found = saved.found.filter(w => solutions[w]);
  } catch(e) {}

  function saveProgress() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({found: found}));
    } catch(e) {}
  }

  const buttons = Array.from(document.querySelectorAll('.tile'));
  const current = document.getElementById('current');
  const message = document.getElementById('message');
  const foundList = document.getElementById('foundList');

  function tileText(i) { return buttons[i].dataset.tile; }

  function consumed(i) {
    const t = tileText(i);
    return found.some(word => solutions[word].includes(t));
  }

  function render() {
    buttons.forEach((b,i) => {
      b.classList.toggle('selected', selected.includes(i));
      b.classList.toggle('used', consumed(i));
      b.disabled = consumed(i);
    });

    current.textContent = selected.length
      ? selected.map(tileText).join(' + ') + ' → ' + selected.map(tileText).join('')
      : 'Tap four tiles to build a word';

    document.getElementById('foundCount').textContent = found.length;
    document.getElementById('score').textContent = found.length * 5;

    if (!found.length) {
      foundList.innerHTML = '<span style="color:#aaa49b">None yet</span>';
    } else {
      foundList.innerHTML = found.map(w => '<span class="chip">' + w + '</span>').join('');
    }
  }

  buttons.forEach((b,i) => {
    b.addEventListener('click', () => {
      if (consumed(i)) return;
      if (selected.includes(i)) {
        selected = selected.filter(x => x !== i);
      } else if (selected.length < 4) {
        selected.push(i);
      }
      message.textContent = '';
      render();
    });
  });

  document.getElementById('undoBtn').addEventListener('click', () => {
    selected.pop(); message.textContent=''; render();
  });

  document.getElementById('submitBtn').addEventListener('click', () => {
    if (selected.length !== 4) {
      message.style.color='var(--bad)';
      message.textContent='Choose exactly four tiles.';
      return;
    }
    const word = selected.map(tileText).join('');
    if (solutions[word] && !found.includes(word)) {
      found.push(word);
      saveProgress();
      selected=[];
      message.style.color='var(--good)';
      message.textContent = found.length===5 ? '🎉 You found all five!' : '✓ Quartile found!';
    } else {
      message.style.color='var(--bad)';
      message.textContent='Not one of today’s five Quartiles.';
    }
    render();
  });

  document.getElementById('hintBtn').addEventListener('click', () => {
    const remaining = Object.keys(solutions).filter(w => !found.includes(w));
    if (!remaining.length) {
      alert('You found all five!');
      return;
    }
    const w = remaining[hintIndex % remaining.length];
    hintIndex++;
    alert('Hint: ' + hints[w] + '\n\nOne tile in this word is: “' + solutions[w][0] + '”');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Reset the puzzle?')) {
      selected=[]; found=[]; hintIndex=0; localStorage.removeItem(storageKey); message.textContent=''; render();
    }
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const squares = Array.from({length:5}, (_,i) => i < found.length ? '🟩' : '⬜').join('');
    const shareText = 'Sister Tile Game #001\n' + squares + '\n' + found.length + '/5 Quartiles found';
    try {
      if (navigator.share) {
        await navigator.share({title:'Sister Tile Game #001', text:shareText});
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(shareText);
        alert('Results copied!\n\n' + shareText);
      } else {
        alert(shareText);
      }
    } catch(e) {}
  });

  document.getElementById('solutionBtn').addEventListener('click', () => {
    if (!confirm('Reveal the answers?')) return;
    alert(Object.keys(solutions).map(w => solutions[w].join(' + ') + ' → ' + w).join('\n'));
  });

  render();
})();
</script>
</body>
</html>
